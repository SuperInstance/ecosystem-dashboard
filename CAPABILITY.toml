# CAPABILITY.toml — ecosystem-dashboard
# Static HTML dashboard for the SuperInstance ecosystem

name = "ecosystem-dashboard"
version = "1.0.0"
description = "Live dashboard: fleet budgets, conservation gauge, capability cloud, repo table, event timeline, language stats"

provides = [
    "fleet-budget-visualization",
    "conservation-gauge-panel",
    "capability-cloud-panel",
    "repo-table-panel",
    "event-timeline-panel",
    "language-stats-panel",
    "supabase-read-access",
]

requires = [
    "supabase-instance",
    "fleet-budget-data",
    "fleet-events-table",
    "capability-data",
]
